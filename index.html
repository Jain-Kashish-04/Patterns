<!DOCTYPE html>
<html>
	<head>
		<title>
			Forming Pattern
		</title>
	</head>
	
	<body>
		
		<script>
			let arr = [1 , 2 , 3 , 4 , 5 , 4 , 3 , 2 , 1 ];
		
			for(let i = 0 ; i < arr.length ; i++){
				let rows =" ";
				
				for(let j = 1 ; j <= arr[j]; j++ ){
					rows = rows + arr[i] + " ";
				}
				document.write(rows + "<br>");
			}
			
		</script>
	</body>
</html>
