<!DOCTYPE html>
<html>
	<head>
		<title>
			Forming Pattern
		</title>
	</head>
	
	<body>
		
		<script>
			let arr = [1,2,3,4,5,4,3,2,1];
		
			document.write("<center>");
			for(let i = 0 ; i < arr.length ; i++){
				let rows =" ";
				
				for(let j = 1 ; j <= arr[i]; j++ ){
					rows += arr[i] + " ";
				}
				document.write(rows + "<br>");
			}
			
		</script>
	</body>
</html>
