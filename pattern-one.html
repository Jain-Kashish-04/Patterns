<!DOCTYPE html>
<html>
	<head>
		<title>
			All patterns 
		</title>
	</head>

	<body>
		<script>
			//Pattern one
			var str = "";
			
			for(var i= 1; i <= 8 ; i++){
				str = " ".repeat(8 - i);
				
				for(var j = 1; j <= i ; j++){
					str += "* ";
				}
				document.write(str + "<br>");
			}
			document.write('<br><br>');
			
			document.write('<hr>');

			//pattern two
			
			for(var i = 8 ; i >= 1 ; i--){
				str = " ".repeat(8 - i);
				
				for(var j = 1 ; j <= i ; j++){
					str += "* ";
				}
				document.write(str + "<br>");
			}
			document.write('<br><br>');
			document.write('<hr>');
			
			//pattern three 
			var str = "";
			for (var i = 1; i <= 6; i++) {
				for (var j = 1; j <= 11; j++) {
					str += "* ";
				}

				document.write(str + "<br>");
				str = "";
			}
			document.write("<br><br>");
			document.write('<hr>');
			
			//pattern four 
			
			for (var i = 1; i <= 6; i++) {
				str = "  ".repeat(6 - i);

				for (var j = 1; j <= i; j++) {
					str += "* ";
				}
				document.write("<pre>" + str + "</pre>");
			}
			document.write("<br><br>");
			document.write('<hr>');
			
			//pattern five
			var str = "";
			for(var i = 1 ; i <= 7 ;i++){
			
				str += " ".repeat(7 - i);
				
				for(var j = 1 ; j <= i ; j++){
					str += "* ";
				}
				str += "\n";
			}
			document.write("<pre>" + str + "</pre>");
			document.write("<br><br>");
			document.write('<hr>');
			
			//pattern six 
						
			var str = "";
			for(var i = 1; i <= 7; i++){

				str += " ".repeat(i - 1);

				for(var j = 1; j <= 7 - i + 1; j++){
					str += "* ";
				}
				str += "\n";
			}

			document.write("<pre>" + str + "</pre>");
			document.write("<br><br>");
			document.write('<hr>');
			
			//pattern seven 
			
			var str = "";
			
			for(var i = 1; i <= 8 ; i++){
				str += " ".repeat((i - 1) * 2);
			
				for(var j = 1; j <= 9- i ; j++){
					str += "* ";
				}
				str += "\n";
			}
			document.write("<pre>"  + str + "</pre>");
			document.write('<hr>');
			
			
		</script>
	</body>
</html>
