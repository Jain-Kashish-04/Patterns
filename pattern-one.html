<!DOCTYPE html>
<html>
	<head>
		<title>
			Pattern-one
		</title>
	</head>

	<body>
		
		<script>
			document.write("<pre>");

			var str = " ";
			
			for (var i = 1; i <= 5 ; i++){
			
				for(var j = 1; j <= 5 ; j++){
				
					if(i == j || i == 5 || j == 1){
						document.write(" *");
					}else{
						document.write("  ");
					}
				}
				document.write("\n");
			}
			document.write("</pre>");
		</script>
	</body>
</html>
