<!DOCTYPE html>
<html>
	<head>
		<title>
			All patterns 
		</title>
	</head>

	<body>
		<script>
			//Pattern one
			var str = "";
			
			for(var i= 1; i <= 8 ; i++){
				str = " ".repeat(8 - i);
				
				for(var j = 1; j <= i ; j++){
					str += "* ";
				}
				document.write(str + "<br>");
			}
			document.write('<br><br>');
			
			//pattern two
			
			for(var i = 8 ; i >= 1 ; i--){
				str = " ".repeat(8 - i);
				
				for(var j = 1 ; j <= i ; j++){
					str += "* ";
				}
				document.write(str + "<br>");
			}
			document.write('<br><br>');
			
	
		</script>
	</body>
</html>
