<!DOCTYPE html>
<html>
	<head>
		<title>
			All patterns 
		</title>
	</head>

	<body id="output">
	
		<script>
			var space = String.fromCharCode(160);
			var nextline = String.fromCharCode(10);
			var output= "";
			
			
			function patterns(str){
				output += str.replace(/ /g,space) + nextline;
			}
			
			//Pattern one
			var str = "";
			
			for(var i= 1; i <= 8 ; i++){
				str = " ".repeat(8 - i);
				
				for(var j = 1; j <= i ; j++){
					str += "* ";
				}
				document.write(str + "<br>");
			}
		
		

			//pattern two
			
			for(var i = 8 ; i >= 1 ; i--){
				str = " ".repeat(8 - i);
				
				for(var j = 1 ; j <= i ; j++){
					str += "* ";
				}
				document.write(str + "<br>");
			}
			
			
			//pattern three 
			var str = "";
			for (var i = 1; i <= 6; i++) {
				for (var j = 1; j <= 11; j++) {
					str += "* ";
				}

				document.write(str + "<br>");
				str = "";
			}
		
			
				
		//pattern four
		var str = "";
		for (var i = 1; i <= 6; i++) {
			str = "   ".repeat(6 - i);

			for (var j = 1; j <= i; j++) {
				str += "* ";
			}

			document.write(str.replace(/ /g, space) + "<br><br>");
		}
		
		// Pattern five

		var str = "";

		for (var i = 1; i <= 7; i++) {
			str += "  ".repeat(7 - i);

			for (var j = 1; j <= i; j++) {
				str += " * ";
			}

			str += "<br>";
		}

		document.write( str.replace(/ /g, space) );
		
		

		// Pattern six

		var str = "";

		for (var i = 1; i <= 7; i++) {
			str += "  ".repeat(i - 1);

			for (var j = 1; j <= 8 - i; j++) {
				str += " * ";
			}

			str += "<br>";
		}

		document.write(str.replace(/ /g, space));
	

		// Pattern seven

		var str = "";

		for (var i = 1; i <= 8; i++) {
			str += "   ".repeat(i - 1);

			for (var j = 1; j <= 9 - i; j++) {
				str += "* ";
			}

			str += "<br>";
		}

		document.write( str.replace(/ /g, space) );
		
					
		</script>
	</body>
</html>
