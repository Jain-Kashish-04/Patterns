<!DOCTYPE html>
<html>
	<head>
		<title>
			Pattern-two
		</title>
	</head>

	<body>
		
		<script>
			document.write("<pre>");

			var str = " ";
			
			for (var i = 1; i <= 8 ; i++){
			
				for(var j = 1; j <= 8 ; j++){
				
					if(i == 1 || j == 1 ||  i + j == 9 ){
						document.write(" *");
					}else{
						document.write("  ");
					}
				}
				document.write("\n");
			}
			document.write("</pre>");
		</script>
	</body>
</html>
